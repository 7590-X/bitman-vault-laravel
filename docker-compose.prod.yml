services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: bitman-laravel:latest
        container_name: bitman-laravel
        restart: always
        ports:
            - "${APP_PORT:-8888}:80"
        env_file:
            - .env
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - storage_data:/var/www/html/storage/app

volumes:
    storage_data:
        driver: local

networks:
    default:
        name: bitman-network
