name: Deploy Laravel Application

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # --------------------------------------------------------
  # Job 1: Test & Quality (Integración Continua - CI)
  # --------------------------------------------------------
  ci:
    name: Continuous Integration (Tests & Quality)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, bcmath, ctype, fileinfo, json, tokenizer, xml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Environment for Testing
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Run Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: ./vendor/bin/phpunit

  # --------------------------------------------------------
  # Job 2: Build & Deploy to VPS via SSH (Despliegue Continuo - CD)
  # --------------------------------------------------------
  cd:
    name: Continuous Deployment (VPS via SSH)
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            echo "==> Accediendo al directorio de despliegue..."
            DEPLOY_DIR="/home/github/deploy"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            echo "==> Sincronizando repositorio..."
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            echo "==> Verificando archivo de entorno .env..."
            if [ ! -f ".env" ]; then
              if [ -f "env_bitman_laravel" ]; then
                cp env_bitman_laravel .env
              elif [ -f ".env.example" ]; then
                cp .env.example .env
                echo "WARNING: .env generado desde .env.example. Por favor actualiza las credenciales de producción."
              fi
            fi

            echo "==> Construyendo y desplegando contenedores Docker..."
            docker compose -f docker-compose.prod.yml up --build -d

            echo "==> Ejecutando migraciones de base de datos..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            echo "==> Optimizando caché de Laravel..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache

            echo "==> Limpiando imágenes de Docker no utilizadas..."
            docker image prune -f

            echo "==> ¡Despliegue completado exitosamente!"
